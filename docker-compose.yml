services:
  app:
    build: . # used by local `docker compose up --build`; CI/CD pulls the same tag instead
    image: ghcr.io/duythuong300599/zalo-image-saver-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SAVE_DIR: /data/images # overrides the dev value from .env
      PORT: "3000"
    volumes:
      - /mnt/ssd-images/zalo-bot-images:/data/images # bind mount: images land directly on the host SSD
    # No reverse proxy here — this server has no public IP (reached only via
    # a Cloudflare Tunnel, same as ssh.thuongtd.cloud). Cloudflare terminates
    # TLS at their edge and the Tunnel's dashboard-configured Public Hostname
    # routes straight to this published host port, so Caddy/Let's Encrypt
    # would have nothing reachable to issue a cert against.
    ports:
      - "3002:3000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
